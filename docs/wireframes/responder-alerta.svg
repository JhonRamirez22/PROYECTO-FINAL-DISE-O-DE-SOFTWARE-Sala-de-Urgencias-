<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <rect width="900" height="600" fill="#f0f2f5"/>
  <rect x="0" y="0" width="200" height="600" fill="#1a237e"/>
  <text x="100" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="bold">UrgencyAI</text>
  <text x="30" y="80" fill="rgba(255,255,255,0.7)" font-size="12">Dashboard</text>
  <text x="30" y="110" fill="rgba(255,255,255,0.7)" font-size="12">Farmacia</text>
  <text x="30" y="140" fill="white" font-size="12">Alertas</text>
  <rect x="220" y="0" width="680" height="50" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="240" y="32" font-size="16" font-weight="bold" fill="#333">Responder a Alerta</text>
  <rect x="220" y="70" width="650" height="510" rx="8" fill="white" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="220" y="70" width="650" height="45" rx="8" fill="#ffebee"/>
  <text x="240" y="100" font-size="13" font-weight="bold" fill="#c62828">ALERTA CRÍTICA: Stock Bajo</text>
  <text x="250" y="140" font-size="11" fill="#555">Medicamento: Ibuprofeno 400mg</text>
  <text x="250" y="165" font-size="11" fill="#555">Stock actual: 15 unidades</text>
  <text x="250" y="190" font-size="11" fill="#555">Mínimo requerido: 50 unidades</text>
  <text x="250" y="215" font-size="11" fill="#555">Fecha de alerta: 25/08/2026 09:15</text>
  <text x="250" y="240" font-size="11" fill="#555">Proveedor: Farmacorp S.A.</text>
  <text x="250" y="275" font-size="13" font-weight="bold" fill="#333">Acciones Disponibles</text>
  <rect x="250" y="290" width="600" height="50" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="270" y="310" font-size="12" font-weight="bold" fill="#1565c0">1. Realizar Pedido de Emergencia</text>
  <text x="270" y="328" font-size="11" fill="#666">Contactar al proveedor para entrega urgente</text>
  <rect x="250" y="350" width="600" height="50" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="270" y="370" font-size="12" font-weight="bold" fill="#388e3c">2. Transferir de Otra Sede</text>
  <text x="270" y="388" font-size="11" fill="#666">Solicitar almacén central</text>
  <rect x="250" y="410" width="600" height="50" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="270" y="430" font-size="12" font-weight="bold" fill="#e65100">3. Marcar como Atendida</text>
  <text x="270" y="448" font-size="11" fill="#666">Confirmar que el problema fue resuelto</text>
  <text x="250" y="490" font-size="11" fill="#555">Comentario de respuesta:</text>
  <rect x="250" y="500" width="400" height="40" rx="4" fill="#fafafa" stroke="#ddd"/>
  <text x="260" y="520" font-size="11" fill="#333">Pedido realizado al proveedor</text>
  <rect x="660" y="510" width="120" height="36" rx="6" fill="#1976d2"/>
  <text x="720" y="533" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Enviar</text>
</svg>