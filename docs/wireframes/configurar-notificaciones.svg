  <text x="250" y="140" font-size="11" fill="#555">Canales de notificación</text>
  <rect x="250" y="150" width="15" height="15" rx="3" fill="#1976d2"/>
  <text x="275" y="162" font-size="11" fill="#333">Email</text>
  <rect x="250" y="175" width="15" height="15" rx="3" fill="#1976d2"/>
  <text x="275" y="187" font-size="11" fill="#333">Push en navegador</text>
  <rect x="250" y="200" width="15" height="15" rx="3" fill="#e0e0e0"/>
  <text x="275" y="212" font-size="11" fill="#333">SMS</text>
  <text x="250" y="245" font-size="13" font-weight="bold" fill="#333">Tipos de Notificación</text>
  <text x="250" y="275" font-size="11" fill="#555">Alertas de stock</text>
  <rect x="500" y="263" width="40" height="20" rx="10" fill="#1976d2"/>
  <text x="520" y="278" text-anchor="middle" fill="white" font-size="10">ON</text>
  <text x="250" y="300" font-size="11" fill="#555">Pacientes críticos</text>
  <rect x="500" y="288" width="40" height="20" rx="10" fill="#1976d2"/>
  <text x="520" y="303" text-anchor="middle" fill="white" font-size="10">ON</text>
  <text x="250" y="325" font-size="11" fill="#555">Diagnósticos pendientes</text>
  <rect x="500" y="313" width="40" height="20" rx="10" fill="#1976d2"/>
  <text x="520" y="328" text-anchor="middle" fill="white" font-size="10">ON</text>
  <text x="250" y="350" font-size="11" fill="#555">Recordatorios de turno</text>
  <rect x="500" y="338" width="40" height="20" rx="10" fill="#e0e0e0"/>
  <text x="520" y="353" text-anchor="middle" fill="#666" font-size="10">OFF</text>
  <text x="250" y="375" font-size="11" fill="#555">Reportes diarios</text>
  <rect x="500" y="363" width="40" height="20" rx="10" fill="#1976d2"/>
