  <text x="420" y="440" font-size="11" fill="#555">Hasta:</text>
  <rect x="470" y="428" width="100" height="25" rx="4" fill="#fafafa" stroke="#ddd"/>
  <text x="480" y="446" font-size="11" fill="#333">22:00</text>
  <rect x="560" y="510" width="150" height="36" rx="6" fill="#1976d2"/>
  <text x="635" y="533" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Guardar</text>
