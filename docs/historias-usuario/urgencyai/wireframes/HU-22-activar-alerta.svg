<text x="580" y="292" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#1F1F1F">Registro del evento</text>
<rect x="568" y="272" width="320" height="300" rx="2" fill="none" stroke="#9AA0A6" stroke-width="1"/>
<text x="580" y="314" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#5F6368">Se registra automáticamente:</text>
<text x="580" y="342" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1F1F1F">· Quién activó la alerta</text>
<text x="580" y="368" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1F1F1F">· Hora exacta</text>
<text x="580" y="394" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1F1F1F">· Ubicación</text>
<text x="580" y="420" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1F1F1F">· Tipo de emergencia</text>
<text x="580" y="446" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1F1F1F">· Personal notificado</text>
<text x="580" y="472" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1F1F1F">· Tiempo de respuesta</text>
<text x="580" y="512" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5F6368">Evento inmutable una vez cerrado.</text>
<circle cx="16" cy="330" r="9" fill="#1F1F1F"/>
<text x="16" y="334" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<circle cx="16" cy="460" r="9" fill="#1F1F1F"/>
<text x="16" y="464" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<circle cx="916" cy="340" r="9" fill="#1F1F1F"/>
<text x="916" y="344" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="32" y="612" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5F6368">El botón no depende del formulario abierto: está en todas las pantallas.</text>
<text x="32" y="632" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5F6368">La alerta notifica a todo el personal conectado, sin excepción de rol.</text>
<text x="32" y="652" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5F6368">Cancelar antes de confirmar no genera evento.</text>
</svg>