<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img">
<rect width="960" height="624" fill="#FFFFFF"/>
<text x="32" y="34" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1F1F1F">HU-14 · Verificar interacciones medicamentosas</text>
<text x="924" y="34" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#5F6368">Wireframe de baja fidelidad</text>
<text x="32" y="62" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#5F6368">A. Severidad contraindicada: bloquea</text>
<rect x="32" y="74" width="856" height="206" rx="3" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="2"/>
<text x="56" y="106" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#1F1F1F">INTERACCIÓN CONTRAINDICADA</text>
<rect x="56" y="122" width="180" height="46" rx="2" fill="#F5F5F5" stroke="#9AA0A6" stroke-width="1"/>
<text x="72" y="151" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#1F1F1F">Warfarina 5 mg</text>
<text x="250" y="151" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#5F6368">+</text>
<rect x="272" y="122" width="190" height="46" rx="2" fill="#F5F5F5" stroke="#9AA0A6" stroke-width="1"/>
<text x="288" y="151" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#1F1F1F">Aspirina 100 mg</text>
<text x="56" y="190" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1F1F1F">Riesgo de hemorragia grave.</text>
<text x="56" y="216" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#1F1F1F">La dispensación está bloqueada.</text>
<text x="56" y="244" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#5F6368">Alternativas en catálogo: Paracetamol 500 mg</text>
<rect x="736" y="236" width="128" height="32" rx="2" fill="#1F1F1F" stroke="#1F1F1F" stroke-width="1"/>
<text x="800.0" y="256.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">Entendido</text>
<circle cx="916" cy="134" r="9" fill="#1F1F1F"/>
<text x="916" y="138" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<circle cx="916" cy="222" r="9" fill="#1F1F1F"/>
<text x="916" y="226" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="32" y="320" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#5F6368">B. Severidad grave: exige justificación</text>
<rect x="32" y="332" width="856" height="230" rx="3" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="2"/>
<text x="56" y="364" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#1F1F1F">Interacción grave: Ibuprofeno + Enalapril</text>
<text x="56" y="394" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#5F6368">Justificación clínica obligatoria, mínimo 20 caracteres</text>
<rect x="56" y="402" width="620" height="84" rx="2" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1"/>
<text x="68" y="424" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5F6368">Paciente hipertenso con dolor agudo; se monitorea presión arterial cada 4 horas.</text>
<text x="56" y="508" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#5F6368">80 / 20 caracteres</text>
<rect x="576" y="498" width="120" height="32" rx="2" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1"/>
<text x="636.0" y="518.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1F1F1F">Cancelar</text>
<rect x="708" y="498" width="156" height="32" rx="2" fill="#1F1F1F" stroke="#1F1F1F" stroke-width="1"/>
<text x="786.0" y="518.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">Dispensar igual</text>
<circle cx="916" cy="394" r="9" fill="#1F1F1F"/>
<text x="916" y="398" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<circle cx="916" cy="514" r="9" fill="#1F1F1F"/>
<text x="916" y="518" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="32" y="596" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5F6368">Severidad moderada: solo advierte y permite continuar sin justificación.</text>
</svg>